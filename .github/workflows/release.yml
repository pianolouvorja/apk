name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex: v0.1.2) para anexar o IPA'
        required: true

permissions:
  contents: write

jobs:
  ios-unsigned-ipa:
    name: iOS IPA (no codesign)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry ../louvorja-piano-ios-unsigned.ipa Payload
          cd -
          ls -lh build/ios/louvorja-piano-ios-unsigned.ipa

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.version }}" \
            build/ios/louvorja-piano-ios-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --clobber
