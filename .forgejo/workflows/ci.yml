name: CI (Forgejo ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      - name: Instalar deps base (git, xz)
        run: |
          apt-get update -qq
          apt-get install -yqq --no-install-recommends git xz-utils ca-certificates unzip
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Flutter SDK 3.44.9 stable
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64) FLUTTER_ARCH=arm64 ;;
            *) FLUTTER_ARCH=x64 ;;
          esac
          git config --global --add safe.directory /opt/flutter
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.9-stable.tar.xz"
          echo "baixando $URL (arch host: $ARCH)"
          curl -fsSL "$URL" -o /tmp/flutter.tar.xz
          tar -xf /tmp/flutter.tar.xz -C /opt
          /opt/flutter/bin/flutter --version
      - name: Pub get
        run: /opt/flutter/bin/flutter pub get
      - name: Analyze
        run: /opt/flutter/bin/flutter analyze --fatal-warnings
      - name: Test
        run: /opt/flutter/bin/flutter test -j 2
